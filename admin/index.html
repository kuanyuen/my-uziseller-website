<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UziSeller Admin</title>
<style>
:root{
  --bg:#f6f7f2;
  --surface:#ffffff;
  --surface-strong:#fffdf6;
  --ink:#20231f;
  --muted:#697064;
  --line:#dfe4d8;
  --brand:#256f73;
  --brand-dark:#174c50;
  --green:#217a52;
  --amber:#9a6500;
  --red:#b8324a;
  --blue:#315da8;
  --shadow:0 14px 34px rgba(31,43,35,.08);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
.shell{min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;border-bottom:1px solid var(--line);background:rgba(246,247,242,.94);backdrop-filter:blur(10px)}
.topbar-inner{max-width:1320px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand{display:flex;align-items:center;gap:12px;min-width:190px}
.mark{width:36px;height:36px;border-radius:8px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;letter-spacing:.02em}
.brand h1{margin:0;font-size:18px;line-height:1.1}
.brand span{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.auth{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.input,.select,.textarea{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;min-height:40px;padding:9px 11px;outline:0}
.input:focus,.select:focus,.textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,111,115,.14)}
.auth .input{width:220px}
.btn{min-height:40px;border-radius:8px;padding:9px 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;background:var(--ink);color:#fff}
.btn:hover{filter:brightness(.95)}
.btn.secondary{background:#e7ebe0;color:var(--ink)}
.btn.ghost{background:transparent;color:var(--brand-dark);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{cursor:not-allowed;opacity:.55}
.main{max-width:1320px;margin:0 auto;padding:24px 22px 38px}
.status-line{min-height:28px;color:var(--muted);font-size:14px;margin-bottom:12px}
.status-line.error{color:var(--red)}
.status-line.ok{color:var(--green)}
.grid-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:var(--shadow)}
.stat span{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.stat strong{display:block;font-size:28px;margin-top:6px;line-height:1}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}
.panel-head{padding:15px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.panel-head h2{margin:0;font-size:17px}
.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) 180px 160px 120px;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--surface-strong)}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:920px}
th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:#fbfcf7}
td{font-size:14px}
tbody tr{cursor:pointer}
tbody tr:hover{background:#f2f6ed}
tbody tr.selected{background:#e7f1ec}
.order-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--muted);max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.title{font-weight:750;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.amount{font-weight:800}
.badge{display:inline-flex;align-items:center;min-height:26px;padding:4px 9px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap}
.badge.pending_payment{background:#fff1c9;color:var(--amber)}
.badge.paid,.badge.processing,.badge.completed{background:#dff3e8;color:var(--green)}
.badge.partial,.badge.partial_supplier_submission{background:#e4ecff;color:var(--blue)}
.badge.payment_failed,.badge.needs_manual_review,.badge.supplier_issue{background:#ffe2e8;color:var(--red)}
.badge.unknown{background:#edf0e8;color:var(--muted)}
.side{position:sticky;top:84px;display:grid;gap:16px}
.detail{padding:16px}
.empty{padding:22px;color:var(--muted);text-align:center}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:8px 12px;margin:12px 0}
.kv dt{color:var(--muted);font-size:12px}
.kv dd{margin:0;word-break:break-word;font-size:14px}
.form-grid{display:grid;gap:10px;margin-top:14px}
.textarea{width:100%;min-height:78px;resize:vertical}
.tools{margin-top:16px}
.tool-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.tool-card{border:1px solid var(--line);border-radius:8px;padding:14px;background:#fff}
.tool-card h3{margin:0 0 10px;font-size:15px}
.tool-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tool-row .input{flex:1 1 150px}
.output{margin:0 16px 16px;background:#171b18;color:#ecf4e8;border-radius:8px;padding:14px;min-height:140px;max-height:320px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}
.mobile-orders{display:none}
.order-card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;margin:10px 16px}
.order-card.selected{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,111,115,.14)}
.order-card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.hidden{display:none!important}
@media (max-width:1020px){
  .layout{grid-template-columns:1fr}
  .side{position:static}
  .grid-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .topbar-inner{align-items:flex-start;flex-direction:column}
  .auth{width:100%;justify-content:stretch}
  .auth .input,.auth .btn{flex:1 1 150px}
  .main{padding:18px 14px 30px}
  .grid-stats{grid-template-columns:1fr 1fr}
  .toolbar{grid-template-columns:1fr}
  .table-wrap{display:none}
  .mobile-orders{display:block;padding-bottom:8px}
  .tool-grid{grid-template-columns:1fr}
}
@media (max-width:460px){
  .grid-stats{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="mark">UZ</div>
        <div>
          <h1>UziSeller Admin</h1>
          <span>Orders, delivery, supplier checks</span>
        </div>
      </div>
      <div class="auth">
        <input id="password" class="input" type="password" autocomplete="current-password" placeholder="ADMIN_PASSWORD">
        <button id="savePassword" class="btn secondary" type="button">保存密码</button>
        <button id="refresh" class="btn" type="button">刷新订单</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div id="message" class="status-line">输入后台密码后刷新订单。</div>

    <section class="grid-stats" aria-label="订单统计">
      <div class="stat"><span>订单数</span><strong id="statTotal">0</strong></div>
      <div class="stat"><span>有效金额 MYR</span><strong id="statRevenue">0.00</strong></div>
      <div class="stat"><span>待付款</span><strong id="statPending">0</strong></div>
      <div class="stat"><span>需处理</span><strong id="statAttention">0</strong></div>
    </section>

    <div class="layout">
      <section class="panel" aria-label="订单列表">
        <div class="panel-head">
          <h2>订单管理</h2>
          <button id="clearFilters" class="btn ghost" type="button">清除筛选</button>
        </div>
        <div class="toolbar">
          <input id="search" class="input" type="search" placeholder="搜索订单、邮箱、供应商单号">
          <select id="statusFilter" class="select">
            <option value="">全部状态</option>
          </select>
          <select id="typeFilter" class="select">
            <option value="">全部类型</option>
            <option value="smm">SMM 服务</option>
            <option value="subscription">账号/订阅</option>
          </select>
          <select id="limit" class="select">
            <option value="50">50 条</option>
            <option value="100" selected>100 条</option>
            <option value="200">200 条</option>
            <option value="500">500 条</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>时间</th>
                <th>订单</th>
                <th>客户</th>
                <th>商品</th>
                <th>金额</th>
                <th>状态</th>
                <th>供应商</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
        <div id="mobileOrders" class="mobile-orders"></div>
        <div id="ordersEmpty" class="empty hidden">没有符合条件的订单。</div>
      </section>

      <aside class="side">
        <section class="panel" aria-label="订单详情">
          <div class="panel-head">
            <h2>订单详情</h2>
            <a id="publicStatus" class="btn ghost hidden" href="#" target="_blank" rel="noreferrer">客户状态页</a>
          </div>
          <div id="detail" class="detail">
            <div class="empty">选择一笔订单查看详情。</div>
          </div>
        </section>
      </aside>
    </div>

    <section class="panel tools" aria-label="供应商工具">
      <div class="panel-head">
        <h2>供应商检查</h2>
        <button id="clearOutput" class="btn ghost" type="button">清空结果</button>
      </div>
      <div class="tool-grid">
        <div class="tool-card">
          <h3>SHOP.APPMMO</h3>
          <div class="tool-row">
            <button class="btn secondary" data-shop-action="profile" type="button">余额</button>
            <button class="btn secondary" data-shop-action="products" type="button">商品</button>
          </div>
          <div class="tool-row">
            <input id="shopProduct" class="input" placeholder="Product ID">
            <button class="btn ghost" data-shop-action="product" type="button">查商品</button>
          </div>
          <div class="tool-row">
            <input id="shopOrder" class="input" placeholder="Transaction / order ref">
            <button class="btn ghost" data-shop-action="order" type="button">查订单</button>
          </div>
        </div>
        <div class="tool-card">
          <h3>SMM Catalogue</h3>
          <div class="tool-row">
            <button id="loadSmmServices" class="btn secondary" type="button">加载服务</button>
          </div>
          <div class="tool-row">
            <input id="smmSearch" class="input" placeholder="服务名称或 ID">
            <button id="filterSmmOutput" class="btn ghost" type="button">筛选结果</button>
          </div>
        </div>
      </div>
      <pre id="output" class="output">等待操作...</pre>
    </section>
  </main>
</div>

<script>
const STATUS_LABELS = {
  pending_payment: "待付款",
  paid: "已付款",
  processing: "处理中",
  partial_supplier_submission: "部分提交",
  completed: "已完成",
  partial: "部分完成",
  payment_failed: "付款失败",
  needs_manual_review: "需人工处理",
  supplier_issue: "供应商异常"
};
const STATUS_OPTIONS = Object.keys(STATUS_LABELS);
const state = {
  password: sessionStorage.getItem("uz_admin_password") || "",
  orders: [],
  selectedId: "",
  smmServices: []
};

const el = {
  password: document.getElementById("password"),
  savePassword: document.getElementById("savePassword"),
  refresh: document.getElementById("refresh"),
  message: document.getElementById("message"),
  statTotal: document.getElementById("statTotal"),
  statRevenue: document.getElementById("statRevenue"),
  statPending: document.getElementById("statPending"),
  statAttention: document.getElementById("statAttention"),
  search: document.getElementById("search"),
  statusFilter: document.getElementById("statusFilter"),
  typeFilter: document.getElementById("typeFilter"),
  limit: document.getElementById("limit"),
  clearFilters: document.getElementById("clearFilters"),
  ordersBody: document.getElementById("ordersBody"),
  mobileOrders: document.getElementById("mobileOrders"),
  ordersEmpty: document.getElementById("ordersEmpty"),
  detail: document.getElementById("detail"),
  publicStatus: document.getElementById("publicStatus"),
  output: document.getElementById("output"),
  clearOutput: document.getElementById("clearOutput"),
  shopProduct: document.getElementById("shopProduct"),
  shopOrder: document.getElementById("shopOrder"),
  loadSmmServices: document.getElementById("loadSmmServices"),
  smmSearch: document.getElementById("smmSearch"),
  filterSmmOutput: document.getElementById("filterSmmOutput")
};

el.password.value = state.password;
for (const status of STATUS_OPTIONS) {
  const option = document.createElement("option");
  option.value = status;
  option.textContent = STATUS_LABELS[status];
  el.statusFilter.append(option);
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    "\"": "&quot;",
    "'": "&#39;"
  }[ch]));
}

function setMessage(text, type = "") {
  el.message.textContent = text;
  el.message.className = `status-line ${type}`.trim();
}

function formatDate(value) {
  if (!value) return "-";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return String(value);
  return date.toLocaleString("zh-CN", { hour12: false });
}

function money(value) {
  const n = Number(value || 0);
  return Number.isFinite(n) ? n.toFixed(2) : "0.00";
}

function orderType(order) {
  return order.type === "subscription" ? "账号/订阅" : "SMM 服务";
}

function orderName(order) {
  return order.name || order.productName || `Order ${order.id || ""}`;
}

function supplierRef(order) {
  if (order.supplierTransactionId) return order.supplierTransactionId;
  if (Array.isArray(order.supplierOrderIds) && order.supplierOrderIds.length) return order.supplierOrderIds.join(", ");
  if (order.supplierOrderId) return order.supplierOrderId;
  if (order.supplierError) return `错误: ${order.supplierError}`;
  return "-";
}

function statusBadge(status) {
  const key = status || "unknown";
  return `<span class="badge ${escapeHtml(key)}">${escapeHtml(STATUS_LABELS[key] || key)}</span>`;
}

async function api(path, options = {}) {
  const password = el.password.value || state.password;
  const headers = Object.assign({ "x-admin-password": password }, options.headers || {});
  const response = await fetch(path, { ...options, headers });
  const text = await response.text();
  let data;
  try { data = JSON.parse(text); }
  catch { data = { status: "error", msg: text || `HTTP ${response.status}` }; }
  if (!response.ok) {
    throw new Error(data.msg || data.error || `HTTP ${response.status}`);
  }
  return data;
}

function buildQuery() {
  const params = new URLSearchParams();
  params.set("limit", el.limit.value);
  if (el.search.value.trim()) params.set("q", el.search.value.trim());
  if (el.statusFilter.value) params.set("status", el.statusFilter.value);
  if (el.typeFilter.value) params.set("type", el.typeFilter.value);
  return params.toString();
}

async function loadOrders() {
  try {
    setMessage("正在读取订单...");
    const data = await api(`/api/admin-orders?${buildQuery()}`);
    state.orders = data.orders || [];
    renderStats(data.stats || {});
    renderOrders();
    const selected = state.orders.find((order) => order.id === state.selectedId);
    if (selected) renderDetail(selected);
    else clearDetail();
    setMessage(`已加载 ${state.orders.length} 条订单。`, "ok");
  } catch (error) {
    setMessage(error.message || "读取失败", "error");
  }
}

function renderStats(stats) {
  el.statTotal.textContent = stats.total || 0;
  el.statRevenue.textContent = money(stats.revenueMYR);
  el.statPending.textContent = stats.pendingPayment || 0;
  el.statAttention.textContent = stats.needsAttention || 0;
}

function renderOrders() {
  el.ordersBody.innerHTML = "";
  el.mobileOrders.innerHTML = "";
  el.ordersEmpty.classList.toggle("hidden", state.orders.length > 0);

  for (const order of state.orders) {
    const selected = order.id === state.selectedId ? "selected" : "";
    const tr = document.createElement("tr");
    tr.className = selected;
    tr.dataset.id = order.id;
    tr.innerHTML = `
      <td>${escapeHtml(formatDate(order.createdAt))}</td>
      <td><div class="order-id">${escapeHtml(order.id)}</div><div class="sub">${escapeHtml(orderType(order))}</div></td>
      <td><div>${escapeHtml(order.customerName || "-")}</div><div class="sub">${escapeHtml(order.email || "")}</div></td>
      <td><div class="title">${escapeHtml(orderName(order))}</div><div class="sub">Qty ${escapeHtml(order.quantity || "-")} · ${escapeHtml(order.service || order.productId || "-")}</div></td>
      <td class="amount">RM ${escapeHtml(money(order.priceMYR))}</td>
      <td>${statusBadge(order.status)}</td>
      <td><div class="order-id">${escapeHtml(supplierRef(order))}</div></td>
    `;
    el.ordersBody.append(tr);

    const card = document.createElement("article");
    card.className = `order-card ${selected}`.trim();
    card.dataset.id = order.id;
    card.innerHTML = `
      <div class="order-card-top">
        <div>
          <div class="title">${escapeHtml(orderName(order))}</div>
          <div class="sub">${escapeHtml(formatDate(order.createdAt))}</div>
        </div>
        ${statusBadge(order.status)}
      </div>
      <div class="sub">${escapeHtml(order.customerName || "-")} · RM ${escapeHtml(money(order.priceMYR))}</div>
      <div class="order-id">${escapeHtml(order.id)}</div>
    `;
    el.mobileOrders.append(card);
  }
}

function clearDetail() {
  state.selectedId = "";
  el.publicStatus.classList.add("hidden");
  el.detail.innerHTML = `<div class="empty">选择一笔订单查看详情。</div>`;
}

function renderDetail(order) {
  state.selectedId = order.id;
  el.publicStatus.href = `/order-status.html?order=${encodeURIComponent(order.id)}`;
  el.publicStatus.classList.remove("hidden");
  const supplierIds = Array.isArray(order.supplierOrderIds) ? order.supplierOrderIds.join("\n") : (order.supplierOrderId || "");
  el.detail.innerHTML = `
    <dl class="kv">
      <dt>订单 ID</dt><dd class="order-id">${escapeHtml(order.id)}</dd>
      <dt>创建时间</dt><dd>${escapeHtml(formatDate(order.createdAt))}</dd>
      <dt>更新时间</dt><dd>${escapeHtml(formatDate(order.updatedAt))}</dd>
      <dt>客户</dt><dd>${escapeHtml(order.customerName || "-")}<br>${escapeHtml(order.email || "")}</dd>
      <dt>商品</dt><dd>${escapeHtml(orderName(order))}</dd>
      <dt>类型</dt><dd>${escapeHtml(orderType(order))}</dd>
      <dt>数量</dt><dd>${escapeHtml(order.quantity || "-")}</dd>
      <dt>金额</dt><dd>RM ${escapeHtml(money(order.priceMYR))}</dd>
      <dt>Billplz</dt><dd>${order.billUrl ? `<a href="${escapeHtml(order.billUrl)}" target="_blank" rel="noreferrer">打开付款单</a>` : escapeHtml(order.billId || "-")}</dd>
      <dt>链接数</dt><dd>${escapeHtml(Array.isArray(order.links) ? order.links.length : (order.link ? 1 : 0))}</dd>
      <dt>目标链接</dt><dd>${escapeHtml(Array.isArray(order.links) ? order.links.join("\n") : (order.link || "-"))}</dd>
    </dl>
    <form id="editOrder" class="form-grid">
      <select class="select" name="status">
        ${STATUS_OPTIONS.map((status) => `<option value="${escapeHtml(status)}" ${order.status === status ? "selected" : ""}>${escapeHtml(STATUS_LABELS[status])}</option>`).join("")}
      </select>
      <textarea class="textarea" name="supplierOrderIds" placeholder="SMM 供应商订单号，一行一个">${escapeHtml(supplierIds)}</textarea>
      <input class="input" name="supplierTransactionId" placeholder="SHOP.APPMMO transaction ID" value="${escapeHtml(order.supplierTransactionId || "")}">
      <input class="input" name="supplierError" placeholder="供应商错误" value="${escapeHtml(order.supplierError || "")}">
      <textarea class="textarea" name="internalNote" placeholder="后台备注">${escapeHtml(order.internalNote || "")}</textarea>
      <button class="btn" type="submit">保存修改</button>
    </form>
  `;
  document.getElementById("editOrder").addEventListener("submit", saveSelectedOrder);
  renderOrders();
}

async function saveSelectedOrder(event) {
  event.preventDefault();
  if (!state.selectedId) return;
  const form = new FormData(event.currentTarget);
  const body = {
    status: form.get("status"),
    supplierOrderIds: form.get("supplierOrderIds"),
    supplierTransactionId: form.get("supplierTransactionId"),
    supplierError: form.get("supplierError"),
    internalNote: form.get("internalNote")
  };
  try {
    setMessage("正在保存订单...");
    const data = await api(`/api/admin-orders?id=${encodeURIComponent(state.selectedId)}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const index = state.orders.findIndex((order) => order.id === data.order.id);
    if (index >= 0) state.orders[index] = data.order;
    renderDetail(data.order);
    setMessage("订单已更新。", "ok");
  } catch (error) {
    setMessage(error.message || "保存失败", "error");
  }
}

async function runShopAction(action) {
  try {
    const params = new URLSearchParams({ action });
    if (action === "product") params.set("product", el.shopProduct.value.trim());
    if (action === "order") params.set("order", el.shopOrder.value.trim());
    setOutput(`正在请求 ${action}...`);
    const data = await api(`/api/subscriptions?${params.toString()}`);
    setOutput(data);
  } catch (error) {
    setOutput({ status: "error", msg: error.message });
  }
}

async function loadSmmServices() {
  try {
    setOutput("正在加载 SMM 服务...");
    const data = await fetch("/api/smm?action=services").then((r) => r.json());
    state.smmServices = data.services || [];
    setOutput({ count: state.smmServices.length, services: state.smmServices.slice(0, 40) });
  } catch (error) {
    setOutput({ status: "error", msg: error.message });
  }
}

function filterSmmOutput() {
  const q = el.smmSearch.value.trim().toLowerCase();
  const list = q
    ? state.smmServices.filter((item) => [item.service, item.name, item.category, item.platformLabel].join(" ").toLowerCase().includes(q))
    : state.smmServices;
  setOutput({ count: list.length, services: list.slice(0, 80) });
}

function setOutput(value) {
  el.output.textContent = typeof value === "string" ? value : JSON.stringify(value, null, 2);
}

function selectOrderFromTarget(target) {
  const row = target.closest("[data-id]");
  if (!row) return;
  const order = state.orders.find((item) => item.id === row.dataset.id);
  if (order) renderDetail(order);
}

el.savePassword.addEventListener("click", () => {
  state.password = el.password.value;
  sessionStorage.setItem("uz_admin_password", state.password);
  setMessage("后台密码已保存到本次浏览器会话。", "ok");
});
el.refresh.addEventListener("click", loadOrders);
el.clearFilters.addEventListener("click", () => {
  el.search.value = "";
  el.statusFilter.value = "";
  el.typeFilter.value = "";
  el.limit.value = "100";
  loadOrders();
});
el.search.addEventListener("keydown", (event) => {
  if (event.key === "Enter") loadOrders();
});
el.statusFilter.addEventListener("change", loadOrders);
el.typeFilter.addEventListener("change", loadOrders);
el.limit.addEventListener("change", loadOrders);
el.ordersBody.addEventListener("click", (event) => selectOrderFromTarget(event.target));
el.mobileOrders.addEventListener("click", (event) => selectOrderFromTarget(event.target));
el.clearOutput.addEventListener("click", () => setOutput("等待操作..."));
document.querySelectorAll("[data-shop-action]").forEach((button) => {
  button.addEventListener("click", () => runShopAction(button.dataset.shopAction));
});
el.loadSmmServices.addEventListener("click", loadSmmServices);
el.filterSmmOutput.addEventListener("click", filterSmmOutput);

if (state.password) loadOrders();
</script>
</body>
</html>
