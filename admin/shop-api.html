<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UziSeller · Shop API</title><style>body{font-family:system-ui;background:#f5f7fb;color:#20273b;margin:0}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#fff;border:1px solid #e2e6f0;border-radius:12px;padding:20px;margin:12px 0}.row{display:flex;gap:10px;flex-wrap:wrap}input,button{padding:10px;border:1px solid #ccd3e0;border-radius:8px}button{background:#4b47d9;color:#fff;border:0;cursor:pointer}.out{background:#0f1422;color:#d9e3ff;padding:12px;border-radius:8px;white-space:pre-wrap;overflow:auto;max-height:280px}.muted{color:#6e778c;font-size:13px}</style></head><body><div class="wrap"><h1>SHOP.APPMMO API 测试</h1><p class="muted">仅供管理员检查供应商接口。API Key 永远只存在服务器端。</p><div class="card"><input id="pw" type="password" placeholder="ADMIN_PASSWORD"><input id="product" placeholder="Product ID"><input id="order" placeholder="Supplier transaction/order ref"><div class="row"><button onclick="run('products')">products</button><button onclick="run('profile')">profile</button><button onclick="run('product')">product</button><button onclick="run('order')">order</button></div></div><div class="card"><h3>结果</h3><pre class="out" id="out">等待测试…</pre></div></div><script>async function run(action){const pw=document.getElementById('pw').value;const qp=new URLSearchParams({action});if(action==='product')qp.set('product',document.getElementById('product').value);if(action==='order')qp.set('order',document.getElementById('order').value);const r=await fetch('/api/subscriptions?'+qp,{headers:{'x-admin-password':pw}});document.getElementById('out').textContent=JSON.stringify(await r.json(),null,2);}</script></body></html>
